name: Football Analysis

on:
  schedule:
    - cron: '0 6 * * *'   # 每天 UTC 6:00（北京时间 14:00）自动运行
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: 初始化五大联赛历史数据（仅运行一次）
        run: python init_history.py
      - name: Debug 检查各联赛数据量
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('data/matches.csv')
          for league in ['PL', 'PD', 'BL1', 'SA', 'FL1']:
              ldf = df[df['league'] == league] if 'league' in df.columns else pd.DataFrame()
              print(f'{league}: {len(ldf)} 条')
              if len(ldf) > 0 and len(ldf) < 20:
                  print('  主队:', list(ldf['home_team'].unique()))
          "
      # ===== 第一步：更新最新赛果（回测前置条件） =====
      - name: 更新比赛结果与赔率
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python fetch_data.py

      # ===== 第二步：回测上一轮预测 =====
      - name: Backtest previous predictions
        run: python backtest.py

      # ===== 第三步：训练与评估模型（基于最新完整数据） =====
      - name: Train and evaluate model
        run: python train_model.py

      # ===== 第四步：生成当日预测 =====
      - name: Generate predictions and report
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python predict_report.py

      # ===== 第五步：提交所有变更 =====
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ model/ docs/
          git commit -m 'Daily update' || echo "No changes"
          git push
