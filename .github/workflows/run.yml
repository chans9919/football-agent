name: Football Analysis

on:
  schedule:
    - cron: '0 6 * * *'   # 每天 UTC 6:00（北京时间 14:00）自动运行
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Debug 赔率匹配
        run: |
          python -c "
          import pandas as pd
          from team_config import normalize_team_name
          odds_df = pd.read_csv('data/odds.csv') if pd.io.common.file_exists('data/odds.csv') else pd.DataFrame()
          if odds_df.empty:
              print('odds.csv 不存在或为空')
          else:
              print(f'赔率记录数: {len(odds_df)}')
              print('主队名:')
              for name in odds_df['home_team'].unique()[:20]:
                  print(f'  [{name}]')
              print('客队名:')
              for name in odds_df['away_team'].unique()[:20]:
                  print(f'  [{name}]')
          "
        
      # ===== 第一步：更新最新赛果（回测前置条件） =====
      - name: 更新比赛结果与赔率
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python fetch_data.py

      # ===== 第二步：回测上一轮预测 =====
      - name: Backtest previous predictions
        run: python backtest.py

      # ===== 第三步：训练与评估模型（基于最新完整数据） =====
      - name: Train and evaluate model
        run: python train_model.py
      - name: 历史回测（仅跑一次，拿到结果后删掉）
        run: python backtest_historical.py

      # ===== 第四步：生成当日预测 =====
      - name: Generate predictions and report
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python predict_report.py

      # ===== 第五步：提交所有变更 =====
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ model/ docs/
          git commit -m 'Daily update' || echo "No changes"
          git push
